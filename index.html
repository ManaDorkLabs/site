<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mana Dork Labs</title>
<meta name="description" content="Infrastructure for marketplace cooperatives.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Mana Dork Labs">
<meta property="og:description" content="Infrastructure for marketplace cooperatives.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d0b'/%3E%3Crect x='6' y='6' width='5' height='20' fill='%234f8f74'/%3E%3Crect x='13' y='6' width='4' height='4' fill='%23ede7d8'/%3E%3Crect x='19' y='6' width='4' height='4' fill='%23ede7d8'/%3E%3Crect x='13' y='14' width='4' height='4' fill='%23ede7d8'/%3E%3Crect x='19' y='14' width='4' height='4' fill='%23ede7d8'/%3E%3Crect x='13' y='22' width='4' height='4' fill='%23ede7d8'/%3E%3Crect x='19' y='22' width='4' height='4' fill='%23ede7d8'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0b0d0b;
    --cream:#ede7d8;
    --dim:#a9a496;
    --verdigris:#4f8f74;
    --verdigris-lo:#2c4f42;
    --lichen:#7a8078;
    --rule:#242a22;
    --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --wide:"Jura","Trebuchet MS",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--ink);color:var(--cream);
    font-family:var(--mono);font-size:13px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    position:relative;overflow-x:hidden;
  }

  /* Verdigris bloom behind the mark, plus a fine mesh over everything. */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 70% 55% at 50% 44%, rgba(79,143,116,.16), rgba(79,143,116,.04) 45%, transparent 72%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(237,231,216,.028) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(237,231,216,.028) 0 1px, transparent 1px 4px);
  }
  .bar, .stage{position:relative;z-index:1}

  .micro{
    font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    color:var(--lichen);margin:0;
  }

  .bar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 28px}
  .bar--top{flex:0 0 auto}
  .bar--bottom{flex:0 0 auto;justify-content:flex-end}

  .stage{
    flex:1 1 auto;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:clamp(20px,4vh,32px) 28px clamp(24px,5vh,44px);text-align:center;
  }

  /* "The Grid" from the wordmark experiments. MANA, DORK and LABS are each
     four letters, so the name stacks into a 4x3 block and the first column
     reads MDL straight down. Jura at 300 is monoline, so every stroke is the
     same width, which is what Roboto Flex could not do. Columns sit at 1.75x
     Jura's widest glyph (0.767em), the "open" step. Glyph size scales against
     viewport height as well as width so the bottom bar is never pushed off. */
  .mark{
    --f:clamp(30px, min(11vw, 11.4vh), 118px);
    --cw:calc(var(--f) * 1.342);
    --rh:calc(var(--f) * 1.34);
    display:grid;grid-template-columns:repeat(4, var(--cw));
    position:relative;
  }
  .mark .cell{
    width:var(--cw);height:var(--rh);
    display:grid;place-items:center;
    font-family:var(--wide);font-weight:300;
    font-size:var(--f);color:var(--cream);line-height:1;
  }
  .mark .cell.key{color:var(--verdigris)}
  .mark .colrule{
    position:absolute;top:calc(var(--rh) * -.08);bottom:calc(var(--rh) * -.08);
    left:var(--cw);width:1px;background:var(--verdigris-lo);
  }

  .tagline{
    margin:clamp(30px,5.5vh,52px) 0 0;font-size:clamp(13px,1.5vw,15px);
    color:var(--cream);line-height:1.75;max-width:58ch;text-wrap:balance;
  }

  .chips{
    display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:14px;margin:clamp(22px,3.6vh,34px) 0 0;padding:11px 20px;
    border:1px solid var(--rule);
  }
  .chips b{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cream)}
  .chips b::before{content:"";display:inline-block;width:5px;height:5px;background:var(--verdigris);margin-right:9px;vertical-align:middle}
  .chips s{text-decoration:none;color:var(--rule)}

  .contact{
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--verdigris);text-decoration:none;white-space:nowrap;
    border:1px solid var(--rule);padding:11px 18px;
  }
  .contact:hover{color:var(--cream);border-color:var(--lichen)}

  @media (max-width:640px){
    .bar{padding:18px 20px}
    .bar--top .micro:last-child{display:none}
    .bar--bottom{flex-direction:column;align-items:stretch;gap:16px}
    .contact{text-align:center}
    .stage{padding:24px 20px 32px}
  }
  @media (prefers-reduced-motion:no-preference){
    .contact{transition:color .15s ease,border-color .15s ease}
  }
</style>
</head>
<body>

  <header class="bar bar--top">
    <p class="micro">Mana Dork Labs</p>
    <p class="micro">In formation &middot; 2026</p>
  </header>

  <main class="stage">
    <div class="mark" role="img" aria-label="Mana Dork Labs">
      <span class="colrule"></span>
      <span class="cell key">M</span><span class="cell">A</span><span class="cell">N</span><span class="cell">A</span>
      <span class="cell key">D</span><span class="cell">O</span><span class="cell">R</span><span class="cell">K</span>
      <span class="cell key">L</span><span class="cell">A</span><span class="cell">B</span><span class="cell">S</span>
    </div>

    <p class="tagline">Infrastructure for marketplace cooperatives.</p>

    <div class="chips">
      <b>Platform</b><s>/</s><b>Governance</b><s>/</s><b>Formation</b>
    </div>
  </main>

  <footer class="bar bar--bottom">
    <a class="contact" href="mailto:REPLACE-ME@manadorklabs.com">Get in touch</a>
  </footer>

</body>
</html>
